name: Adventure Companion Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    name: JavaScript and weather checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Check JavaScript syntax
        run: |
          node --check version.js
          node --check app.js
          node --check reliability.js
          node --check service-worker.js
          node --check service-worker-update.js
          node --check service-worker-update.test.js
          node --check weather-service.js
          node --check weather-ui.js
          node --check weather-service.test.js
          node --check daily-weather.test.js
          node --check dashboard-redesign.test.js
          node --check packing.test.js
          node --check reliability.test.js
          node --check experience-polish.test.js
          node --check experience-completion.test.js
          node --check version-foundation.test.js
          node --check adventure/adventure-access.js
          node --check adventure/adventure-switcher.js
          node --check adventure/firebase/adventure-access-provider.mjs
          node --check adventure/firebase/adventure-sync-startup.mjs
          node --check adventure-access.test.js
          node --check adventure-access-provider.test.js
          node --check adventure-aware-welcome.test.js
          node --check adventure-switcher-ui.test.js
          node --check adventure-sync-startup.test.js
          node --check adventure-membership-service.test.js

      - name: Run complete regression suite
        run: |
          node version-foundation.test.js
          node configuration-foundation.test.js
          node weather-service.test.js
          node daily-weather.test.js
          node dashboard-redesign.test.js
          node packing.test.js
          node reliability.test.js
          node experience-polish.test.js
          node experience-completion.test.js

      - name: Run focused M4-03.2 access checks
        run: |
          node --test adventure-access.test.js adventure-access-provider.test.js adventure-aware-welcome.test.js adventure-switcher-ui.test.js adventure-sync-startup.test.js google-sign-in.test.js adventure-membership-service.test.js firebase-membership-provider.test.js

      - name: Run complete root regression suite
        run: node --test *.test.js

      - name: Install and test trusted invitation functions
        run: |
          npm ci --prefix functions --ignore-scripts
          npm test --prefix functions

      - name: Run invitation emulator security checks
        env:
          ADVENTURE_INVITATION_HMAC_KEY: synthetic-ci-secret-with-at-least-32-bytes
        shell: bash
        run: |
          secret_file="functions/.secret.local"
          cleanup() {
            rm -f "$secret_file"
          }
          trap cleanup EXIT
          umask 077
          printf 'ADVENTURE_INVITATION_HMAC_KEY=%s\n' "$ADVENTURE_INVITATION_HMAC_KEY" > "$secret_file"
          npx --yes firebase-tools@15.25.1 emulators:exec --project demo-adventure-companion --only auth,firestore,functions "npm --prefix functions run test:emulator"

      - name: Verify required application files
        shell: bash
        run: |
          required_files=(
            index.html
            version.js
            app.js
            styles.css
            service-worker.js
            service-worker-update.js
            config.js
            manifest.webmanifest
            weather-service.js
            weather-ui.js
            reliability.js
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

          echo "All required application files are present."

      - name: Verify weather integration
        shell: bash
        run: |
          grep -q 'id="weatherCard"' index.html
          grep -q 'src="weather-service.js"' index.html
          grep -q 'src="weather-ui.js"' index.html

          service_line=$(grep -n 'src="weather-service.js"' index.html | head -1 | cut -d: -f1)
          ui_line=$(grep -n 'src="weather-ui.js"' index.html | head -1 | cut -d: -f1)

          if [[ -z "$service_line" || -z "$ui_line" || "$service_line" -ge "$ui_line" ]]; then
            echo "weather-service.js must load before weather-ui.js"
            exit 1
          fi

          echo "Weather card and script order are correct."

      - name: Verify critical startup protection
        shell: bash
        run: |
          node -e "const fs=require('fs'); const size=fs.statSync('app.js').size; console.log('app.js bytes:',size); if(size<=50000) process.exit(1);"
          grep -q 'function view(v)' app.js
          grep -q 'function showDay(' app.js
          grep -q 'markAppReady' app.js
          grep -q 'src="version.js"' index.html
          grep -q 'src="reliability.js"' index.html
          grep -q 'AdventureCompanionBuild' app.js
          grep -q 'importScripts("./config.js","./version.js")' service-worker.js
          grep -q 'adventure-companion-m4-03-build-7' version.js
          echo "Critical startup protection is present."
